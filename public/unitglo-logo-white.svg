<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <filter id="whiteShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Group: Unitglo Logo Icon -->
  <g transform="translate(10, 10)">
    <!-- Cyan Upper Left Arm -->
    <path d="M 12 10 C 12 5.5 15.5 2 20 2 C 24.5 2 28 5.5 28 10 L 28 55 L 12 70 Z" fill="#00A6FF" />
    
    <!-- Dark Lower Left Arm & Bottom Base Curve -->
    <path d="M 12 70 L 28 55 L 28 85 C 28 98 38 108 51 108 C 64 108 74 98 74 85 L 74 65 L 50 65 C 46 65 43 62 43 58 C 43 54 46 51 50 51 L 82 51 C 86.5 51 90 54.5 90 59 L 90 85 C 90 106.5 72.5 124 51 124 C 29.5 124 12 106.5 12 85 Z" fill="#38BDF8" />

    <!-- Cyan Right Arm -->
    <path d="M 74 10 C 74 5.5 77.5 2 82 2 C 86.5 2 90 5.5 90 10 L 90 51 L 74 51 Z" fill="#00A6FF" />
  </g>

  <!-- Group: UNITGLO SOLUTIONS Typography -->
  <!-- Top Word: UNITGLO -->
  <text 
    x="125" 
    y="64" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-size="62" 
    font-weight="900" 
    letter-spacing="2" 
    fill="#FFFFFF" 
    filter="url(#whiteShadow)"
  >UNITGLO</text>

  <!-- Bottom Word: SOLUTIONS -->
  <text 
    x="126" 
    y="120" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-size="52" 
    font-weight="900" 
    letter-spacing="5" 
    fill="#FFFFFF" 
    filter="url(#whiteShadow)"
  >SOLUTIONS</text>
</svg>
